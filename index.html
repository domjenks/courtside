<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Courtside</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courtside">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b1b3f">
<style>
:root{--acc:#1D42BA;--bg:#f4f6fb;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--ink:#111827;--green:#16a34a;--red:#dc2626;--c1:#C8102E;--c2:#1D42BA}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1d;--card:#141b2e;--muted:#9aa3b5;--line:#26304a;--ink:#e8ecf5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer}
header{background:linear-gradient(135deg,var(--c1),#0b1b3f 120%);color:#fff;padding:18px 16px 16px;border-bottom:4px solid var(--c2)}
.hrow{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;letter-spacing:.4px;text-transform:uppercase}
header p{margin:2px 0 0;opacity:.85;font-size:13px}
.pick{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px}
.pick button.tsel{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;border:0;font-size:15px;font-weight:800;background:rgba(255,255,255,.18);color:#fff;text-align:left}
.tsel .chev{margin-left:auto;opacity:.8}
.sportbtn{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;position:relative;flex:none;padding:0}
.sportbtn span{font-size:30px;line-height:1}
.sportbtn i{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;background:var(--bg);color:var(--ink);text-align:left;font-family:inherit}
.srow.on{border-color:var(--acc)}
.srow .e{font-size:34px}.srow b{display:block;font-size:17px}.srow small{color:var(--muted);font-size:13px}
.srow[disabled]{opacity:.45}
.trow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;padding:10px 12px;margin-bottom:6px;color:#fff;text-align:left;font-family:inherit}
.trow .tnm{flex:1;font-weight:800;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.trow .tct{font-size:12px;font-weight:800;background:rgba(0,0,0,.28);padding:4px 9px;border-radius:999px;white-space:nowrap}
.trow.on{outline:3px solid var(--ink);outline-offset:1px}
.pick select option{color:#111}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 96px}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;position:relative}
.stat{background:var(--card);border-radius:16px;padding:14px 12px 13px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stat .meter{width:100%}
.stat .k{margin-bottom:2px}
.stat .s2{font-size:11px;font-weight:700;margin-top:3px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.18)}
.stat .ic{position:absolute;right:8px;top:6px;font-size:22px;opacity:.85;filter:saturate(1.3) drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.stat .v{font-size:28px;font-weight:900;line-height:1.05;letter-spacing:-.5px}
.stat .v small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.stat .s{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.hero{background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff}
.stat.hero .k,.stat.hero .s,.stat.hero .v small{color:rgba(255,255,255,.85)}
.stat.hero .ic{opacity:.95}
.stat.hero.alt{background:linear-gradient(140deg,var(--c2),var(--c1))}
.stat .ic.vs{font-size:22px;font-weight:900;font-style:italic;letter-spacing:-1px;color:var(--acc);opacity:.95;top:8px;right:10px;filter:none}
.tabs button{padding:10px 2px!important;font-size:13px!important}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex:none;font-size:15px}
.av.sm{width:26px;height:26px;font-size:11px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:14px}
.fchip.on{background:var(--c2);border-color:var(--c2);color:#fff}
.lb{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);text-align:left;font-family:inherit}
.lb:first-child{border-top:0}
.lb .rk{width:26px;text-align:center;font-weight:900;font-size:16px;color:var(--muted)}
.lb .nm{flex:1;min-width:0}.lb .nm b{display:block;font-size:15px}.lb .nm small{color:var(--muted);font-size:12px}
.lb .big{font-size:22px;font-weight:900;text-align:right}.lb .big small{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-bottom:8px}
.pod{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.pod .av{margin:0 auto 6px}
.pod.p1{background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;padding-top:16px}
.pod .n{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pg{font-size:22px;font-weight:900}.pod .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.75;font-weight:700}
.ring{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring i{position:absolute;inset:5px;border-radius:50%;background:var(--c1)}
.ring b{position:relative;font-size:10px;font-weight:900;color:#fff}
.meter{height:6px;background:var(--line);border-radius:6px;margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.streak{display:inline-block;margin-top:5px;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.22)}
html[data-mode="dark"]{--bg:#0a0f1d;--card:#141b2e;--muted:#9aa3b5;--line:#26304a;--ink:#e8ecf5}
html[data-mode="light"]{--bg:#f4f6fb;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--ink:#111827}
.thsel{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.thsel.on{color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.open{display:flex}
.modal .box{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px;max-height:86vh;overflow:auto}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.sw{aspect-ratio:1;border-radius:12px;border:2px solid transparent;position:relative;padding:0}
.sw.on{border-color:var(--ink)}
.sw span{position:absolute;inset:auto 0 3px 0;font-size:9px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:10px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.tabs button.on{background:var(--c2);color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px 6px 10px;text-align:center;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.tile.none .badge{filter:grayscale(1);opacity:.35}
.tile.none .tn{color:var(--muted)}
.tile.mine{outline:2px solid var(--c1)}
.badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;letter-spacing:.5px;box-shadow:inset 0 0 0 4px var(--b2),0 2px 6px rgba(0,0,0,.15);flex:none}
.badge.sm{width:40px;height:40px;font-size:12px;box-shadow:inset 0 0 0 3px var(--b2)}
.badge.lg{width:64px;height:64px;font-size:18px}
.tn{font-size:12px;font-weight:700;margin-top:6px;line-height:1.15}
.gl{margin-top:6px;width:100%;display:flex;flex-direction:column;gap:4px}
.gl .gx{font-size:11px;background:var(--bg);border-radius:7px;padding:5px 3px;border:0;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.gl b{font-weight:800}
.addt{margin-top:6px;font-size:12px;font-weight:800;color:var(--acc);background:none;border:0;padding:4px}
.T{color:var(--muted)}.W{color:var(--green)}.L{color:var(--red)}.U{color:var(--muted)}
.tag{font-size:10px;font-weight:800;color:var(--acc);margin-top:4px;text-transform:uppercase}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.g{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.info{flex:1;min-width:0}
.info .o{font-weight:700}
.info .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{font-weight:800;font-size:14px;flex:none;text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c1)}
.ar{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--card);margin-bottom:5px}
.ar .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.ar.on .ck{background:var(--green);border-color:var(--green)}
.ar .nm{flex:1;font-weight:600;font-size:14px}
.ar .tm{font-size:12px;color:var(--muted);font-weight:400}
.ar:not(.on){opacity:.65}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.fab{position:fixed;right:18px;bottom:22px;background:var(--fab,var(--c1));color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:5}
.ha{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.4px;padding:2px 7px;border-radius:999px;margin-top:4px;background:var(--line);color:var(--ink)}
.ha.h{background:var(--acc);color:#fff}
.mrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.mrow textarea{min-height:44px;resize:none;overflow:hidden}
.mrow button{flex:none;width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:18px}
.slab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.allst summary{cursor:pointer;font-weight:800;padding:4px 0;list-style:none}
.allst summary::-webkit-details-marker{display:none}
.chip{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 6px;border-radius:6px;margin-top:3px}
.gl .chip{font-size:9px;padding:1px 4px;margin-top:2px}
.t-pre{background:#e5e7eb;color:#4b5563}.t-cup{background:#fef3c7;color:#92400e}.t-po{background:#dbeafe;color:#1e40af}.t-pi{background:#ede9fe;color:#5b21b6}
/* full-screen pages */
.page{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none}
.page.open{display:block}
.ptop{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:12px;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
.ptop .t{flex:1;font-weight:800;font-size:16px}
.ptop button{border:0;background:var(--bg);color:var(--ink);font-weight:800;font-size:14px;padding:9px 14px;border-radius:10px}
.ptop button.pri{background:var(--c1);color:#fff}
.score{display:flex;align-items:center;justify-content:space-around;text-align:center;padding:6px 0}
.score .tm{font-size:12px;font-weight:700;margin-top:6px}
.score .big{font-size:38px;font-weight:900;line-height:1}
.score .mid{font-size:12px;color:var(--muted);font-weight:700}
.meta{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 4px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:700;text-align:right;padding:4px 5px;white-space:nowrap}
td{padding:6px 5px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.bx{overflow-x:auto}
.bx td:first-child{position:sticky;left:0;background:var(--card);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.st0 td:first-child{font-weight:700}
.perf{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.perf:first-child{border-top:0}
.perf .n{flex:1;font-weight:700;font-size:14px}
.perf .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.perf .v{font-weight:800;font-size:14px;text-align:right}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:14px;align-items:center}
.cmp .l{text-align:left;font-weight:700}.cmp .r{text-align:right;font-weight:700}.cmp .m{text-align:center;color:var(--muted);font-size:12px}
.cmp .best{color:var(--acc)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700}
.seg button.on{background:var(--c2);color:#fff;border-color:var(--c2)}
.bigbtn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:800;font-size:15px;background:var(--c2);color:#fff;margin-top:10px}
.bigbtn.ghost{background:var(--line);color:var(--ink)}
.bigbtn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.form{padding:14px 14px 40px;max-width:640px;margin:0 auto}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{display:none}.sub.show{display:block}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.ok{color:var(--green)}.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.lsc td,.lsc th{text-align:center}.lsc td:first-child,.lsc th:first-child{text-align:left}
</style>
</head>

<div class="page" id="settings"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>

async function findHighlight(g){

    const title=((e.getElementsByTagName("title")[0]||{}).textContent||"");const T=title.toUpperCase();
    const vid=((e.getElementsByTagName("yt:videoId")[0]||{}).textContent||"").trim();

function statTiles(games,w,l,by,nbaArenas){
  const R=recOf(games),RP=recOf(games,true);const pct=R.n?Math.round(100*R.pct):0;
  const dated=games.filter(g=>result(g)&&g.type!=="pre").sort((a,b)=>b.date.localeCompare(a.date));
  let streak="";if(dated.length){const f=result(dated[0]);let n=0;for(const g of dated){if(result(g)===f)n++;else break}streak=f+n}
  const years=games.map(g=>+g.date.slice(0,4));const first=years.length?Math.min(...years):null;
  const seasons=new Set(games.map(g=>seasonOf(g.date))).size;
  const teamsSeen=Object.keys(by).length;
  const fav=Object.entries(by).sort((a,b)=>b[1].length-a[1].length)[0];
  return `<div class="stats">
   <div class="stat hero"><div class="ic" style="left:8px;right:auto">${SP.emoji}</div><div class="k">Record${SP.otl?" (W-L-OTL)":""}</div><div class="v">${R.str}</div>
     <div class="s">${R.n?pct+"% wins":"No results yet"}</div><div class="s2">With ${SP.pre.toLowerCase()}: ${RP.str}</div>${streak?`<span class="streak">${streak[0]==="W"?"🔥":"🧊"} ${streak[0]==="W"?"Won":"Lost"} last ${streak.slice(1)}</span>`:""}
     <div class="ring" style="background:conic-gradient(#fff ${pct*3.6}deg,rgba(255,255,255,.25) 0)"><i></i><b>${pct}%</b></div></div>
   <div class="stat hero alt"><div class="ic">🎟️</div><div class="k">Games attended</div><div class="v">${games.length}</div>
     <div class="s">${first?`Since ${first} · ${seasons} season${seasons===1?"":"s"}`:"Add your first game"}</div>
     ${games.length?(()=>{const rec=hm=>recOf(games.filter(g=>!!g.home===hm)).str;const nh=games.filter(g=>g.home).length;
       return `<div class="s2">${nh} home (${rec(true)}) · ✈️ ${games.length-nh} away (${rec(false)})</div>`})():""}</div>
   <div class="stat"><div class="ic vs">VS</div><div class="k">Teams seen</div><div class="v">${teamsSeen}<small> / ${TEAMS.length-1}</small></div>
     <div class="meter"><i style="width:${teamsSeen/(TEAMS.length-1)*100}%"></i></div><div class="s">${fav?"Most: "+esc(nick(team(fav[0])))+" ("+fav[1].length+")":"—"}</div></div>
   <div class="stat"><div class="ic">${SP.id==="mlb"?"🏟️":"🏟️"}</div><div class="k">${SP.league} ${SP.venues}</div><div class="v">${nbaArenas}<small> / ${[...new Set(TEAMS.map(t=>t[2]))].length}</small></div>
     <div class="meter"><i style="width:${nbaArenas/[...new Set(TEAMS.map(t=>t[2]))].length*100}%"></i></div><div class="s">${[...new Set(TEAMS.map(t=>t[2]))].length-nbaArenas} to go</div></div>
  </div><div class="note" style="text-align:right;margin:4px 4px 0;font-size:11px">Record doesn't count ${SP.pre.toLowerCase()}</div>`;
}

// ---------- friends ----------
if(!state.friends)state.friends=[];
const FCOL=["#E4572E","#2E86DE","#10AC84","#8E44AD","#F39C12","#D63031","#00A8B5","#6C5CE7","#E84393","#2D3436","#16A085","#C0392B"];
const fcolor=f=>{let h=0;for(const ch of f.name)h=(h*31+ch.charCodeAt(0))>>>0;return FCOL[h%FCOL.length]};
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const avatar=(f,cls)=>`<div class="av ${cls||""}" style="background:${fcolor(f)}">${esc(initials(f.name))}</div>`;
const friend=id=>state.friends.find(f=>f.id===id);
let FSEL="";
function friendStats(games){
  return state.friends.map(f=>{const gs=games.filter(g=>(g.friends||[]).includes(f.id)).sort((a,b)=>b.date.localeCompare(a.date));
    let w=0,l=0,pw=0,pl=0;gs.forEach(g=>{const r=result(g);if(r==="W")pw++;if(r==="L")pl++;if(g.type==="pre")return;if(r==="W")w++;if(r==="L")l++});
    const arenas=new Set(gs.map(g=>g.arena)).size;const opps={};gs.forEach(g=>opps[g.opp]=(opps[g.opp]||0)+1);
    const fav=Object.entries(opps).sort((a,b)=>b[1]-a[1])[0];
    return {f,gs,n:gs.length,w,l,pw,pl,rec:recOf(gs).str,recP:recOf(gs,true).str,pct:w+l?w/(w+l):null,arenas,last:gs[0],first:gs[gs.length-1],fav:fav?fav[0]:null}}).sort((a,b)=>b.n-a.n||(b.pct||0)-(a.pct||0)||a.f.name.localeCompare(b.f.name));
}
function friendsTab(games){
  const S=friendStats(games);
  if(!state.friends.length)return `<div class="card" style="text-align:center;padding:24px 16px"><div style="font-size:34px">👥</div><div style="font-weight:800;font-size:16px;margin-top:6px">Track who you go to games with</div><div class="note">Add friends here, or right inside "Add game", and tag them on each game. You'll get a leaderboard, your record with each person and more.</div><button class="bigbtn" id="faddbig">+ Add a friend</button></div>`;
  if(FSEL&&friend(FSEL))return friendDetail(S.find(x=>x.f.id===FSEL));
  const withAny=games.filter(g=>(g.friends||[]).length).length;
  const solo=games.length-withAny;
  const charm=S.filter(x=>x.w+x.l>=2).sort((a,b)=>b.pct-a.pct||b.w-a.w)[0];
  const top=S.filter(x=>x.n>0);
  let h=`<div class="stats" style="margin-bottom:10px">
    <div class="stat hero"><div class="ic">👥</div><div class="k">With friends</div><div class="v">${withAny}<small> / ${games.length}</small></div><div class="s">${solo} solo game${solo===1?"":"s"}</div></div>
    <div class="stat hero alt"><div class="ic">🍀</div><div class="k">Lucky charm</div><div class="v" style="font-size:20px;margin-top:4px">${charm?esc(charm.f.name):"—"}</div><div class="s">${charm?`${charm.rec} together (${Math.round(charm.pct*100)}%)`:"Needs 2+ games with results"}</div></div></div>`;
  if(top.length){const p=[top[1],top[0],top[2]];
    h+=`<div class="podium">${p.map((x,i)=>x?`<button class="pod ${i===1?"p1":""}" data-fr="${x.f.id}" style="border:0;font-family:inherit;color:inherit">${i===1?'<div style="font-size:20px;margin-top:-6px">👑</div>':""}${avatar(x.f)}<div class="n">${esc(x.f.name)}</div><div class="pg">${x.n}</div><div class="l">${["2nd","1st","3rd"][i]} · games</div></button>`:`<div></div>`).join("")}</div>`}
  h+=`<div class="sec">Leaderboard</div><div class="card">`+S.map((x,i)=>`<button class="lb" data-fr="${x.f.id}"><div class="rk">${x.n?(i<3?["🥇","🥈","🥉"][i]:i+1):"–"}</div>${avatar(x.f)}<div class="nm"><b>${esc(x.f.name)}</b><small>${x.n?`${x.rec} together${x.pw+x.pl!==x.w+x.l?` (${x.recP} w/ pre)`:""} · last ${fmt(x.last.date).s}`:"No games yet"}</small></div><div class="big">${x.n}<small>game${x.n===1?"":"s"}</small></div></button>`).join("")+`</div>
   <div class="row" style="gap:8px"><input id="fnew" placeholder="Friend's name" style="flex:1"><button class="bigbtn" id="fadd" style="width:auto;margin:0;padding:11px 16px">Add</button></div>
   <div class="note" style="text-align:center">Tap a friend to see your games together · tag friends when you add or edit a game</div>`;
  return h;
}
function friendDetail(x){
  const f=x.f;
  let h=`<div class="card"><div class="row" style="justify-content:flex-start;gap:12px">${avatar(f)}<div style="flex:1"><div style="font-weight:900;font-size:19px">${esc(f.name)}</div><div class="note" style="margin:0">${x.n?`Since ${fmt(x.first.date).s}`:"No games together yet"}</div></div><button class="bigbtn ghost" id="fback" style="width:auto;margin:0;padding:8px 12px">‹ All</button></div></div>
   <div class="stats" style="margin-bottom:10px">
    <div class="stat hero alt"><div class="k">Games together</div><div class="v">${x.n}</div><div class="s">${x.arenas} arena${x.arenas===1?"":"s"}</div></div>
    <div class="stat hero"><div class="k">Record together</div><div class="v">${x.rec}</div><div class="s">${x.pct==null?"No results yet":Math.round(x.pct*100)+"% wins"}</div><div class="s2">With ${SP.pre.toLowerCase()}: ${x.recP}</div></div>
    <div class="stat"><div class="k">Most seen opponent</div><div class="v" style="font-size:20px;margin-top:4px">${x.fav?esc(nick(team(x.fav))):"—"}</div></div>
    <div class="stat"><div class="k">Last game</div><div class="v" style="font-size:20px;margin-top:4px">${x.last?fmt(x.last.date).s:"—"}</div></div></div>
   <div class="sec">Games together</div>`;
  if(!x.n)h+=`<div class="empty">Tag ${esc(f.name)} on a game to see it here.</div>`;
  x.gs.forEach(g=>{const t=team(g.opp),r=result(g),ft=fmt(g.date);const others=(g.friends||[]).filter(id=>id!==f.id).map(friend).filter(Boolean);
    h+=`<div class="card"><button class="g" data-open="${g.id}">${badge(t,"sm")}<div class="info"><div class="o">${g.home?"vs":"@"} ${esc(t[1])}</div><div class="a">${ft.m} ${ft.n}, ${ft.y} · ${esc(g.arena)}</div>${others.length?`<div class="a">Also with ${others.map(o=>esc(o.name)).join(", ")}</div>`:""}${typeChip(g)}</div><div class="res"><div class="${r||"U"}">${r?r+" "+esc(g.ps)+"-"+esc(g.os):"—"}</div></div></button></div>`});
  if(x.n)h+=`<button class="bigbtn" id="fshareall">📤 Share all ${x.n} game${x.n===1?"":"s"} with ${esc(f.name)}</button><div class="note" style="text-align:center">${esc(f.name)} can add every game you went to together in one tap.</div>`;
  h+=`<div class="sec">Manage</div><div class="card"><label style="margin-top:0">Name</label><input id="frename" value="${esc(f.name)}"><button class="bigbtn ghost" id="fsave">Save name</button><button class="bigbtn danger" id="fdelf">Remove ${esc(f.name)}</button></div>`;
  return h;
}
function addFriend(name){name=(name||"").trim();if(!name)return null;
  const ex=state.friends.find(f=>f.name.toLowerCase()===name.toLowerCase());if(ex)return ex;
  const f={id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name};state.friends.push(f);save();return f}
function wireFriends(){
  document.querySelectorAll("#root [data-fr]").forEach(b=>b.onclick=()=>{FSEL=b.dataset.fr;render();window.scrollTo(0,0)});
  if($("faddbig"))$("faddbig").onclick=()=>{$("root").querySelector(".card").innerHTML=`<label style="margin-top:0">Friend's name</label><input id="fnew"><button class="bigbtn" id="fadd">Add</button>`;wireFriends();$("fnew").focus()};
  if($("fadd")){const go=()=>{const f=addFriend($("fnew").value);if(f){toast("Added "+f.name);render()}};$("fadd").onclick=go;$("fnew").onkeydown=e=>{if(e.key==="Enter")go()}}
  if($("fback"))$("fback").onclick=()=>{FSEL="";render()};
  if($("fshareall"))$("fshareall").onclick=()=>{const f=friend(FSEL);const gs=myGames().filter(g=>(g.friends||[]).includes(FSEL));shareMany(gs,f)};
  if($("fsave"))$("fsave").onclick=()=>{const f=friend(FSEL),n=$("frename").value.trim();if(f&&n){f.name=n;save();render();toast("Saved")}};
  if($("fdelf")){let armed=false;$("fdelf").onclick=()=>{if(!armed){armed=true;$("fdelf").textContent="Tap again to remove (games stay)";return}
    state.friends=state.friends.filter(f=>f.id!==FSEL);Object.values(state.data).forEach(d=>d.games.forEach(g=>{if(g.friends)g.friends=g.friends.filter(id=>id!==FSEL)}));FSEL="";save();render();toast("Removed")}}
}

    const rl=p=>`${p.s["CAR"]||0} car · ${p.s["YDS"]||0} yds${num(p.s["TD"])?` · ${p.s["TD"]} TD`:""}`;

    const dlx=p=>`${p.s["TOT"]||0} tkl${num(p.s["SACKS"])?` · ${p.s["SACKS"]} sacks`:""}${num(p.s["TFL"])?` · ${p.s["TFL"]} TFL`:""}${num(p.s["PD"])?` · ${p.s["PD"]} PD`:""}`;
    const q=qb("us"),r=rb("us"),w=wr("us"),d=dl("us"),q2=qb("them"),r2=rb("them"),w2=wr("them");
    if(q)perf.push([M,q,"Passing",`${q.s["YDS"]||0} YDS`,pl(q)]);
    if(r)perf.push([M,r,"Rushing",`${r.s["YDS"]||0} YDS`,rl(r)]);
    if(w)perf.push([M,w,"Receiving",`${w.s["YDS"]||0} YDS`,cl(w)]);
    if(d&&defScore(d)>0)perf.push([M,d,"Defense",`${d.s["TOT"]||0} TKL`,dlx(d)]);
    if(q2)perf.push([O,q2,"Their passing",`${q2.s["YDS"]||0} YDS`,pl(q2)]);
    const p2=[r2,w2].filter(Boolean).sort((a,c)=>num(c.s["YDS"])-num(a.s["YDS"]))[0];
    if(p2)perf.push([O,p2,p2===r2?"Their rushing":"Their receiving",`${p2.s["YDS"]||0} YDS`,p2===r2?rl(p2):cl(p2)]);
    if(perf.length){h+=`<div class="sec">Top performers</div><div class="card">`+perf.map(([t,p,k,v,sub])=>`<div class="perf">${badge(t,"sm")}<div class="n">${esc(p.n)}<small>${k} · ${esc(sub)}</small></div><div class="v">${esc(v)}</div></div>`).join("")+`</div>`}
    // team comparison
    const want=[[/^firstDowns$/i,"First downs"],[/^totalYards$/i,"Total yards"],[/^netPassingYards$/i,"Passing yards"],[/^rushingYards$/i,"Rushing yards"],[/thirdDownEff/i,"3rd down"],[/fourthDownEff/i,"4th down"],
      [/redZoneAttempts/i,"Red zone"],[/^turnovers$/i,"Turnovers",1],[/sacksYardsLost/i,"Sacks-yards lost",1],[/totalPenaltiesYards/i,"Penalties",1],[/possessionTime/i,"Possession"]];
    const tstat=(k,re)=>{const x=(b.teams[k]||[]).find(s=>re.test(s[0]));return x?x[2]:""};
    let rows=want.map(([re,lab,low])=>{const a=tstat("us",re),c=tstat("them",re);return a!==""&&c!==""?[lab,a,c,low]:null}).filter(Boolean);
    if(!rows.length){const mapT={};(b.teams.them||[]).forEach(x=>mapT[x[0]]=x);rows=(b.teams.us||[]).filter(x=>mapT[x[0]]).slice(0,14).map(x=>[x[1],x[2],mapT[x[0]][2]])}
    if(rows.length)h+=`<div class="sec">Team stats</div><div class="card"><div class="cmp"><div class="l">${M[0]}</div><div class="m"></div><div class="r">${O?O[0]:""}</div>`+
      rows.map(([lab,a,c,low])=>{const x=num(a),y=num(c);const simple=/^-?[\d.]+$/.test(String(a))&&/^-?[\d.]+$/.test(String(c));const aw=simple&&(low?x<y:x>y),cw=simple&&(low?y<x:y>x);
        return `<div class="l ${aw?"best":""}">${esc(a)}</div><div class="m">${lab}</div><div class="r ${cw?"best":""}">${esc(c)}</div>`}).join("")+`</div></div>`;
    // box score tables by category
    const order=[["passing","Passing"],["rushing","Rushing"],["receiving","Receiving"],["defensive","Defense"],["interceptions","Interceptions"],["kicking","Kicking"],["punting","Punting"],["kickReturns","Kick returns"],["puntReturns","Punt returns"],["fumbles","Fumbles"]];
    const tbl=(t,k)=>order.filter(([nm])=>(b.fb[k]||{})[nm]&&b.fb[k][nm].rows.length).map(([nm,lab])=>{const G=b.fb[k][nm];
      return `<div class="sec">${esc(t?nick(t):"")} ${lab.toLowerCase()}</div><div class="card bx"><table><tr><th>Player</th>${G.labels.map(l=>`<th>${esc(l)}</th>`).join("")}</tr>`+
        G.rows.map(p=>`<tr><td>${esc(p.n)}${p.pos?` <span style="color:var(--muted);font-size:11px">${esc(p.pos)}</span>`:""}</td>${G.labels.map(l=>`<td>${esc(p.s[l]??"")}</td>`).join("")}</tr>`).join("")+`</table></div>`}).join("");
    h+=tbl(M,"us")+tbl(O,"them");
  }else if(hasStats(g)&&b.players){
    // line score
    const n=Math.max(b.line.us.length,b.line.them.length);
    if(n){h+=`<div class="sec">Score by ${SP.period}</div><div class="card bx"><table class="lsc"><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${SP.periodLabel(i,n,g)}</th>`).join("")}<th>T</th></tr>
      <tr><td><b>${M[0]}</b></td>${Array.from({length:n},(_,i)=>`<td>${esc(b.line.us[i]??"")}</td>`).join("")}<td><b>${esc(g.ps)}</b></td></tr>
      <tr><td><b>${O?O[0]:""}</b></td>${Array.from({length:n},(_,i)=>`<td>${esc(b.line.them[i]??"")}</td>`).join("")}<td><b>${esc(g.os)}</b></td></tr></table></div>`}
    // top performers
    const top=(arr,k)=>arr.filter(p=>!p.dnp).slice().sort((a,b)=>(+b[k]||0)-(+a[k]||0))[0];
    const perf=[];const us=b.players.us,th=b.players.them;
    const tp=top(us,"pts"),tr=top(us,"reb"),ta=top(us,"ast"),op=top(th,"pts");
    if(tp)perf.push([M,tp,"Points",`${tp.pts} PTS`,`${tp.reb} reb · ${tp.ast} ast · ${tp.fg} FG`]);
    if(tr&&tr!==tp)perf.push([M,tr,"Rebounds",`${tr.reb} REB`,`${tr.pts} pts · ${tr.ast} ast`]);else if(tr)perf.push([M,tr,"Rebounds",`${tr.reb} REB`,""]);
    if(ta)perf.push([M,ta,"Assists",`${ta.ast} AST`,`${ta.pts} pts · ${ta.reb} reb`]);
    if(op)perf.push([O,op,"Top scorer",`${op.pts} PTS`,`${op.reb} reb · ${op.ast} ast`]);
    if(perf.length){h+=`<div class="sec">Top performers</div><div class="card">`+perf.map(([t,p,k,v,sub])=>`<div class="perf">${badge(t,"sm")}<div class="n">${esc(p.n)}<small>${k}${sub?" · "+esc(sub):""}</small></div><div class="v">${esc(v)}</div></div>`).join("")+`</div>`}
    // team comparison
    const want=["fieldGoalPct","threePointFieldGoalPct","freeThrowPct","totalRebounds","assists","steals","blocks","turnovers","totalTurnovers","pointsInPaint","fastBreakPoints","largestLead"];
    const mapU={},mapT={};b.teams.us.forEach(s=>mapU[s[0]]=s);b.teams.them.forEach(s=>mapT[s[0]]=s);
    let rows=want.filter(k=>mapU[k]&&mapT[k]);
    if(rows.includes("totalTurnovers"))rows=rows.filter(k=>k!=="turnovers");
    if(!rows.length)rows=Object.keys(mapU).filter(k=>mapT[k]).slice(0,12);
    if(rows.length){const lowGood=k=>/turnover/i.test(k);
      h+=`<div class="sec">Team stats</div><div class="card"><div class="cmp"><div class="l">${M[0]}</div><div class="m"></div><div class="r">${O?O[0]:""}</div>`+
      rows.map(k=>{const a=parseFloat(mapU[k][2]),c=parseFloat(mapT[k][2]);const aw=lowGood(k)?a<c:a>c,cw=lowGood(k)?c<a:c>a;
        return `<div class="l ${aw?"best":""}">${esc(mapU[k][2])}</div><div class="m">${esc(mapU[k][1])}</div><div class="r ${cw?"best":""}">${esc(mapT[k][2])}</div>`}).join("")+`</div></div>`}
    // box scores
    const boxT=(t,arr)=>`<div class="sec">${esc(t?t[1]:"")} box score</div><div class="card bx"><table><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>FG</th><th>3PT</th><th>FT</th><th>STL</th><th>BLK</th><th>TO</th><th>+/-</th></tr>`+
      arr.map(p=>p.dnp?`<tr><td>${esc(p.n)}</td><td colspan="11" style="text-align:left;color:var(--muted)">${esc(p.dnp)}</td></tr>`:
      `<tr class="st${p.s?0:1}"><td>${esc(p.n)}</td><td>${esc(p.min)}</td><td><b>${esc(p.pts)}</b></td><td>${esc(p.reb)}</td><td>${esc(p.ast)}</td><td>${esc(p.fg)}</td><td>${esc(p.tp)}</td><td>${esc(p.ft)}</td><td>${esc(p.stl)}</td><td>${esc(p.blk)}</td><td>${esc(p.to)}</td><td>${esc(p.pm)}</td></tr>`).join("")+`</table></div>`;
    h+=boxT(M,us)+boxT(O,th);
  }else if(!busy){
    h+=`<div class="card" style="text-align:center"><div class="note" style="margin:0 0 4px">${g.boxErr?`<span class="err">${esc(g.boxErr)}</span>`:"No stats loaded for this game yet."}</div></div>`;
  }
  const gf=(g.friends||[]).map(friend).filter(Boolean);
  if(gf.length){h+=`<div class="sec">Went with</div><div class="card"><div class="fchips" style="margin:0">${gf.map(f=>`<span class="fchip">${avatar(f,"sm")}${esc(f.name)}</span>`).join("")}</div></div>`}
  if((g.stats&&g.stats.length)||g.notes){h+=`<div class="sec">My notes</div><div class="card">${(g.stats||[]).map(x=>`<div>• ${esc(x)}</div>`).join("")}${g.notes?`<div style="margin-top:6px;font-style:italic">${esc(g.notes)}</div>`:""}</div>`}
  h+=`<button class="bigbtn ${b?"ghost":""}" id="dref" ${busy?"disabled":""}>${busy?"Loading…":(b?"↻ Refresh stats":"Get score & stats")}</button>`;
  if(b&&b.fetched)h+=`<div class="note" style="text-align:center">Stats from ESPN · updated ${new Date(b.fetched).toLocaleDateString()}</div>`;
  h+=`</div>`;
  $("detail").innerHTML=h;
  $("dback").onclick=closeDetail;
  $("dedit").onclick=()=>openEdit(g);
  $("dshare").onclick=()=>shareGame(og);
  $("dref").onclick=()=>refresh(og);
  if($("hlwatch"))$("hlwatch").onclick=()=>openUrl("https://www.youtube.com/watch?v="+g.hl.id);
  if($("hlsearch"))$("hlsearch").onclick=()=>openUrl(hlSearchUrl(g));
  if(!busy&&!g.hl&&hlCandidate(g)){findHighlight(og).then(found=>{if(found){save();if(cur===og.id)renderDetail()}}).catch(()=>{})}
}
async function refresh(g){
  renderDetail(true);
  try{await lookup(g);delete g.boxErr;save();toast(g.pending?"Game isn't final yet":"Stats updated")}
  catch(e){g.boxErr=e.message;toast(e.message)}
  save();renderDetail();render();
}

function clearFound(){if(draft&&draft.espnId){delete draft.espnId;delete draft.box}}
function readForm(){const d=draft;
  d.date=$("fd").value;d.opp=$("fo").value;
  d.arena=$("fa").value==="__other"?($("fx").value.trim()||"Other venue"):$("fa").value;
  d.ps=$("fp").value;d.os=$("fs").value;d.notes=$("fn").value.trim();d.stats=[...$("fmom").querySelectorAll("textarea")].map(t=>t.value.trim()).filter(Boolean);
  d.cup=d.type==="cup"?$("fcs").value:"";d.round=d.type==="po"?$("fr").value:"";d.gnum=d.type==="po"?$("fg").value:"";}
function fillForm(){const d=draft;
  $("fp").value=d.ps||"";$("fs").value=d.os||"";
  document.querySelectorAll("#edit [data-h]").forEach(x=>x.classList.toggle("on",(x.dataset.h==="1")===!!d.home));syncLabelsFn();
  document.querySelectorAll("#edit [data-ot]").forEach(x=>x.classList.toggle("on",x.dataset.ot===(d.ot||"")));
  document.querySelectorAll("#edit [data-t]").forEach(x=>x.classList.toggle("on",x.dataset.t===d.type));
  $("fcup").classList.toggle("show",d.type==="cup");$("fpo").classList.toggle("show",d.type==="po");
  $("fcs").value=d.cup||"";$("fr").value=d.round||"";$("fg").value=d.gnum||"";
  const opts=TEAMS.map(t=>t[2]);if(opts.includes(d.arena)){$("fa").value=d.arena;$("fx").style.display="none"}else{$("fa").value="__other";$("fx").value=d.arena;$("fx").style.display="block"}}
async function findInForm(){
  readForm();const d=draft;
  if(!d.opp){$("fmsg").innerHTML=`<span class="err">Choose the opponent first.</span>`;return}
  $("ffind").disabled=true;$("fmsg").innerHTML=`<span class="spin"></span>Looking up the game…`;
  const keepManual=d.typeManual;d.typeManual=false;d.arenaManual=false;
  try{await lookup(d);fillForm();
    const r=result(d);
    $("fmsg").innerHTML=`<span class="ok">✓ Found it${r?`: ${r} ${esc(d.ps)}-${esc(d.os)}`:(d.pending?" (not final yet)":"")}${hasStats(d)?" · box score saved":""}</span>`;}
  catch(e){d.typeManual=keepManual;$("fmsg").innerHTML=`<span class="err">${esc(e.message)}</span>`}
  $("ffind").disabled=false;
}
async function saveEdit(){
  readForm();const d=draft;
  if(!d.opp){toast("Choose the opponent");$("fo").focus();return}
  if(!d.date){toast("Pick a date");return}
  const rec=d._flip?flipGame(d):d;
  const i=state.games.findIndex(x=>x.id===rec.id);if(i>=0)state.games[i]=rec;else state.games.push(rec);
  save();closeEdit();render();
  const needs=!d.espnId;
  openDetail(d.id);
  if(needs){refresh(d)} // auto-pull stats for new games
}
function closeEdit(){$("edit").classList.remove("open");draft=null}

   <textarea id="mpaste" rows="5" style="margin-top:8px" placeholder="Long-press here and tap Paste">${esc(t)}</textarea>
   <button class="bigbtn ghost" id="mpst">📋 Paste from clipboard</button>
   <button class="bigbtn" id="mgo">Import</button><button class="bigbtn ghost" id="mclose">Cancel</button>`;
  $("modal").classList.add("open");$("mclose").onclick=closeModal;
  $("mpst").onclick=()=>{try{$("mpaste").value=(window.Native&&Native.paste&&Native.paste())||""}catch(e){}};
  $("mgo").onclick=()=>{const v=$("mpaste").value;
    const pm=parseMany(v),p1=pm?null:parseShared(v);
    if(!pm&&!p1){toast("No shared game found in that text");return}
    if(isMine(pm||p1)){toast("That's a game you shared. Send it to your friend to import on their phone.");return}
    closeModal();setTimeout(()=>checkIncoming(v,false),50)};
}

// Android back button: close the top page first
window.onBack=function(){
  if($("modal").classList.contains("open")){closeModal();return true}
  if($("edit").classList.contains("open")){closeEdit();return true}
  if($("settings").classList.contains("open")){$("settings").classList.remove("open");return true}
  if($("detail").classList.contains("open")){closeDetail();return true}
  return false;
};
render();
setTimeout(()=>{let t="";try{if(window.Native&&Native.takeIncoming)t=Native.takeIncoming()||""}catch(e){}
  if(!(t&&checkIncoming(t,false)))checkClipboard()},400);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(checkClipboard,300)});
})();
</script>
</body>
</html>
